services:
  db:
    image: postgres:16
    container_name: phonebook-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RoKo@2024
      POSTGRES_DB: phonebook_db

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phonebook_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  backend:
    build:
      context: ./backend

    container_name: phonebook-backend

    environment:
      DATABASE_URL: postgresql://postgres:RoKo%402024@db:5432/phonebook_db
      ASPNETCORE_URLS: http://0.0.0.0:8000

    depends_on:
      db:
        condition: service_healthy

    restart: on-failure


  frontend:
    build:
      context: ./frontend

    container_name: phonebook-frontend

    ports:
      - "80:80"

    depends_on:
      - backend


  api-tests:
    profiles: ["test"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./backend:/src
    environment:
      TEST_POSTGRES_HOST: db
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: RoKo@2024
    depends_on:
      db:
        condition: service_healthy
    command: ["dotnet", "test", "Phonebook.slnx", "--nologo"]


volumes:
  postgres_data:
